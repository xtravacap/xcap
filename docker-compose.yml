services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xcap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/xcap?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  # One-off: `docker compose run --rm migrate` to apply migrations + seed.
  # Uses the `builder` stage (not the pruned `runner` image) because it needs
  # tsx/devDependencies to execute prisma/seed.ts directly.
  migrate:
    build:
      context: .
      target: builder
    profiles: ["tools"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/xcap?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]

volumes:
  pgdata:
